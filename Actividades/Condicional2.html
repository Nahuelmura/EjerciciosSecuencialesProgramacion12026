<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>

        let temperatura = parseFloat(prompt("Ingrese la temperatura en grados Celsius:"));

            if (temperatura < 0) {
                alert("Congelación");
            } else if (temperatura >= 0 && temperatura <= 25) {
                alert("Normal");
            } else {
               alert("Calor Extremo");
            }
    </script>
</body>
</html>
