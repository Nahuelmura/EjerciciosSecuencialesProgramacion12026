<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    

    <script>
        let lista = " ";
        let valorIngresado = parseInt(prompt("Ingrese valor"));

        for (let i = valorIngresado; i >= 0; i--) {
            
            lista += i + " ";
        }
        alert(lista)
    </script>
</body>
