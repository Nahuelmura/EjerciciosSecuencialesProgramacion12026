<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>

        let tareas = parseFloat(prompt("Ingrese la calificación "));
            let asistencia = parseFloat(prompt("Ingrese el porcentaje de asistencia "));

            if (tareas >= 90 && asistencia >= 95) {
             alert("desempeño: excelente");
            } else if (tareas >= 80 && asistencia >= 90) {
             alert("desempeño: muy bueno");
            } else if (tareas >= 70 && asistencia >= 80) {
               alert("desempeño: bueno");
            } else {
                alert("desempeño: insuficiente");
            }
    </script>
</body>
</html>
