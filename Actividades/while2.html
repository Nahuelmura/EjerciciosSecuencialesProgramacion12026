<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>

        let ingrese = parseInt(prompt("Ingrese la letra"));

        while (ingrese !== 3) {
            if (ingrese === 1) {
                alert("Ingresara datos")
            } else if (ingrese === 2) {
                alert("Mostrar datos")
            } else {
                alert("El numero no esta en el menu")
            }

            ingrese = parseInt(prompt("Ingrese la letra"));

        } 
    </script>
</body>
</html>
