<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>
        let nombreTrabajador = prompt("Ingrese nombre del trabajador");
        let sueldo = parseInt(prompt("Ingresar sueldo del trabajador" + nombreTrabajador));
         

        let incremento = sueldo * 0.25;

        let sueldoCobrar = sueldo + incremento;

        alert("el nuevo sueldo de " + nombreTrabajador +"es de " + sueldoCobrar)

    </script>
</body>
</html>
